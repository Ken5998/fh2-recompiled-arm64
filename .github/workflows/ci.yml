name: ARM64 build

# Builds FH2 Recompiled (its pinned commit, plus patches/) for linux-arm64
# with its own copy of the ReXGlue SDK and the Vulkan backend, two ways:
# natively on GitHub's ARM64 runner in a bare Fedora 44 (the release ArmadaOS
# is built on) with only the pinned toolchain, as the handheld does, and
# cross-compiled on x86-64 Ubuntu.
#
# No game files are involved: the game is built with placeholder recompiled
# code (scripts/placeholder-codegen.py), which checks that the program and its
# two guest modules compile and link but does not make a game that runs.

on:
  # Every branch: work reaches main without pull requests, once this is green.
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      ref:
        description: FH2 Recompiled commit or branch (default the one in upstream.json)
        required: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 150
    steps:
      # No compilers, CMake or development files, as on ArmadaOS: the pinned
      # toolchain and sysroot bring them. jinja2 is only for the placeholder.
      - name: Install git, Python, the download tools and the desktop libraries
        run: >-
          dnf install -y --setopt=install_weak_deps=False git python3 python3-jinja2 curl tar xz
          libX11 libX11-xcb libxcb libwayland-client
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out FH2 Recompiled and patch it
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build the recompiler
        run: |
          scripts/build-rexglue.sh "$RUNNER_TEMP/work/fh2-recompiled" "$RUNNER_TEMP/toolchain"
          "$RUNNER_TEMP/work/fh2-recompiled/sdk/out/linux-arm64/rexglue" --help | head -n 20
      - name: Build the game with placeholder recompiled code
        run: |
          fh2="$RUNNER_TEMP/work/fh2-recompiled"
          scripts/placeholder-codegen.py "$fh2/app" "$fh2/sdk"
          scripts/build-game.sh "$fh2" "$RUNNER_TEMP/toolchain"
      - name: Check that the program starts and finds its libraries
        run: |
          fh2="$RUNNER_TEMP/work/fh2-recompiled"
          export LD_LIBRARY_PATH="$fh2/sdk/out/linux-arm64:$fh2/app/out/linux-arm64"
          # No screen here, and no game: it only has to load and get going.
          timeout 20 "$fh2/app/out/linux-arm64/fh2" --help 2>&1 | tee "$RUNNER_TEMP/start.log" || true
          ! grep -q "error while loading shared libraries" "$RUNNER_TEMP/start.log"

  cross:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install CMake, Ninja, wayland-scanner and jinja2
        run: >-
          sudo apt-get update -q && sudo apt-get install -y -q cmake ninja-build pkgconf libwayland-bin
          python3-jinja2
      - uses: actions/checkout@v5
      - name: Fetch the pinned toolchain
        run: scripts/fetch-toolchain.sh "$RUNNER_TEMP/toolchain"
      - name: Check out FH2 Recompiled and patch it
        env:
          REF: ${{ inputs.ref }}
        run: scripts/prepare.sh "$RUNNER_TEMP/work" ${REF:+"$REF"}
      - name: Build the game with placeholder recompiled code
        run: |
          fh2="$RUNNER_TEMP/work/fh2-recompiled"
          scripts/placeholder-codegen.py "$fh2/app" "$fh2/sdk"
          scripts/build-game.sh "$fh2" "$RUNNER_TEMP/toolchain"
